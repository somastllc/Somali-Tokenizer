name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p somali-tokenizer --lib --no-default-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps -p somali-tokenizer
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust 1.85 (MSRV, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p somali-tokenizer

  python-reference:
    name: Python reference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tokenizers==0.21.4 tqdm pytest ruff
      - run: ruff check .
      - run: pytest

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for the cross-check test
        run: cargo build -p somali-tokenizer
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist
      - name: Install wheel and test
        shell: bash
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "transformers>=4.40"
          python -m pip install --no-index --find-links dist somali-tokenizer
          python -m pytest
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        working-directory: bindings/python
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
