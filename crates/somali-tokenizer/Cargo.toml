[package]
name = "somali-tokenizer"
description = "Somali ByteLevel BPE tokenizer: encode, decode, and validate the somali-bpe artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["tokenizer", "somali", "bpe", "nlp"]
categories = ["text-processing"]

[features]
default = ["cli"]
# Command-line binary.
cli = ["dep:clap", "dep:anyhow"]
# Load artifacts from the Hugging Face Hub.
http = ["tokenizers/http"]

[dependencies]
tokenizers.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
unicode-normalization.workspace = true

[[bin]]
name = "somali-tokenizer"
path = "src/bin/somali-tokenizer.rs"
required-features = ["cli"]

[lints]
workspace = true
